<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>BLUE.BERRY</title>
        <style>
            body {
                margin:0px;
            }
            
            * {
                font-family:"comic sans ms", "comic sans", sans-serif;
                box-sizing:border-box;
            }
            
            header {
                background-color:#007BFF;
                padding:20px;
                display:flex;
                justify-content:space-between;
                box-shadow: 0px 7px 16px #007BFF;
            }
            
            header strong {
                color:white;
            }
            
            .action-btn {
                color:white;
                background-color:#007BFF;
                border:2px solid #007BFF;
                border-radius:8px;
                font-weight:bold;
                padding:5px;
                font-size:15px;
            }
            
            #board-input {
                border:2px solid #007BFF;
                border-radius:8px;
                margin-top:20px;
                margin-bottom:5px;
                min-height:120px;
                padding:10px;
            }
            
            #board-compose {
                display:flex;
                flex-direction:column;
            }
            
            #message-board {
                margin-left:10px;
                margin-right:10px;
            }
            
            #login-box {
                text-align:center;
                border-radius:8px;
                border:2px solid #007BFF;
                height:80%;
                width:80%;
                margin:10%;
                background-color:#64D7FF;
            }
            
            #login-box input, #login-box button {
                border-radius:8px;
                border:2px solid #007BFF;
                padding:5px;
                background-color:rgb(215, 240, 242);
                margin-bottom:5px;
            }
            
            #login-box h2 {
                color:white;
            }
            
            #site-content {
                display:none;
            }
            
            button.secondary-btn {
              background: rgba(30, 41, 59, 0.8);
              color: #00f0ff;
              border: 1px solid #00f0ff;
              padding: 0.6rem 1.2rem;
              border-radius: 4px;
              font-weight: bold;
              cursor: pointer;
              text-transform: uppercase;
              letter-spacing: 1px;
              transition: all 0.2s ease;
            }
        
            button.secondary-btn:hover {
              background: rgba(0, 240, 255, 0.1);
              box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
            }
        </style>
    </head>
    <body>
        <div id="login-box">
            <h2 id="sign-in">Sign In</h2>
            <input type="email" id="email" placeholder="Email"><br>
            <input type="password" id="password" placeholder="Password"><br>
            <button onclick="login()" id="login">Log In</button>
            <p id="login-status"></p>
        </div>
        <div id="site-content">
            <header>
                <strong>BLUE.BERRY</strong>
                <strong>CHATTING PLATFORM 🚀</strong>
            </header>
            <main>
                <div id="message-board">
                    <div id="board-messages"></div>
                    <div id="board-compose">
                        <textarea id="board-input" placeholder="Type a message..." maxlength="1000"></textarea>
                        <button class="action-btn" onclick="postBoardMessage()">Post</button>
                    </div>
                </div>
            </main>
        </div>
        <script type="module">
            import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
                import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
                import { getDatabase, ref, push, onValue, get, set, remove } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";
        
            const firebaseConfig = {
                apiKey: "AIzaSyBfDGzeL-okz84Wqh7FBD9Pmi0O_SsKuq4",
                authDomain: "blue-berry-3b1de.firebaseapp.com",
                projectId: "blue-berry-3b1de",
                storageBucket: "blue-berry-3b1de.firebasestorage.app",
                messagingSenderId: "2636710459",
                appId: "1:2636710459:web:a62019fbcb66821f9f121e"
            };
        
          const app = initializeApp(firebaseConfig);
          const auth = getAuth(app);
          const db = getDatabase(app);
        
          // Make these available globally so your other JS (or later code) can use them
          window.firebaseAuth = auth;
          window.firebaseDB = db;
        
          window.login = function() {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            signInWithEmailAndPassword(auth, email, password)
              .catch((error) => {
                document.getElementById("login-status").textContent = "Login failed: " + error.message;
              });
          };
        
          onAuthStateChanged(auth, (user) => {
            if (user) {
              console.log("Signed in as:", user.email);
              document.getElementById("login-box").style.display = "none";
              document.getElementById("site-content").style.display = "block";
              loadBoardMessages();
            } else {
              console.log("Not signed in");
              document.getElementById("login-box").style.display = "block";
              document.getElementById("site-content").style.display = "none";
            }
          });
          
          function getDisplayName(email) {
              if (!email) {
                return "Unknown";
              }
              var name = email.split("@")[0];
              return name.charAt(0).toUpperCase() + name.slice(1);
          }
          
          function postBoardMessage() {
              var input = document.getElementById("board-input");
              var text = input.value.trim();
            
              if (text === "") {
                return;
              }
            
              var user = auth.currentUser;
              if (!user) {
                return;
              }
            
              var replyToId = input.dataset.replyToId || null;
            
              push(ref(db, "messages/" + user.uid), {
                sender: getDisplayName(user.email),
                text: text,
                time: Date.now(),
                replyToId: replyToId
              });
            
              input.value = "";
              delete input.dataset.replyToId;
            
              var boardDiv = document.getElementById("board-messages");
              boardDiv.insertAdjacentElement("afterend", document.getElementById("board-compose"));
            
              loadBoardMessages();
            }
            window.postBoardMessage = postBoardMessage;
    
            function loadBoardMessages() {
              get(ref(db, "messages")).then(function(snapshot) {
                var allMessages = [];
            
                snapshot.forEach(function(userNode) {
                  userNode.forEach(function(msgNode) {
                    var msg = msgNode.val();
                    msg.id = msgNode.key;
                    allMessages.push(msg);
                  });
                });
            
                allMessages.sort(function(a, b) {
                  return a.time - b.time;
                });
            
                var boardDiv = document.getElementById("board-messages");
                boardDiv.innerHTML = "";
            
                var wrappersById = {};
            
                allMessages.forEach(function(msg) {
                  var wrapper = document.createElement("div");
                  wrapper.style.marginBottom = "8px";
            
                  if (msg.replyToId) {
                    wrapper.style.marginLeft = "30px";
                    wrapper.style.borderLeft = "2px solid #7928ca";
                    wrapper.style.paddingLeft = "10px";
                  }
            
                  var msgElement = document.createElement("p");
                  var initial = msg.sender.charAt(0).toUpperCase();
                  msgElement.innerHTML = "<span title='" + msg.sender + "' style='display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; border-radius:50%; background:#007BFF; color:#0b0d17; font-weight:bold; font-size:0.75rem; margin-right:6px; cursor:default;'>" + initial + "</span>" + msg.text;
            
                  var replyBtn = document.createElement("button");
                  replyBtn.className = "secondary-btn";
                  replyBtn.innerText = "Reply";
                  replyBtn.style.fontSize = "0.7rem";
                  replyBtn.style.padding = "2px 8px";
                  replyBtn.style.marginLeft = "6px";
                  replyBtn.onclick = function() {
                    replyToMessage(msg.sender, msg.id, wrapper);
                  };
            
                  msgElement.appendChild(replyBtn);
                  wrapper.appendChild(msgElement);
            
                  wrappersById[msg.id] = wrapper;
            
                  if (msg.replyToId && wrappersById[msg.replyToId]) {
                    wrappersById[msg.replyToId].insertAdjacentElement("afterend", wrapper);
                  } else {
                    boardDiv.appendChild(wrapper);
                  }
                });
              });
            }
            window.loadBoardMessages = loadBoardMessages;
            
            function replyToMessage(name, messageId, messageWrapper) {
              var compose = document.getElementById("board-compose");
              messageWrapper.insertAdjacentElement("afterend", compose);
            
              var textarea = document.getElementById("board-input");
              textarea.dataset.replyToId = messageId;
              textarea.value = "@" + name + " ";
              textarea.focus();
            }
            window.replyToMessage = replyToMessage;
        </script>
    </body>
</html>
